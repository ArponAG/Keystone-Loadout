<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Keystone Loadout">
  <!--
    App tile icon for the CasaOS dashboard. Deliberately an SVG with no external
    references: CasaOS renders the tile with a plain <img>, and the file is served by the
    app itself, so anything fetched from elsewhere would break the tile whenever the app
    is the thing that is down.

    Palette is the app's own: --color-base for the ground, --color-accent for the mark.
  -->
  <rect width="128" height="128" rx="26" fill="#0e0f13"/>
  <rect x="4" y="4" width="120" height="120" rx="23" fill="none" stroke="#23262f" stroke-width="2"/>

  <!-- A keystone: the wedge block at the crown of an arch. -->
  <path d="M64 26 L92 46 L84 92 L44 92 L36 46 Z"
        fill="none" stroke="#c8a45c" stroke-width="7"
        stroke-linejoin="round"/>
  <path d="M36 46 L92 46" stroke="#c8a45c" stroke-width="5" stroke-linecap="round" opacity="0.55"/>
  <circle cx="64" cy="68" r="9" fill="#c8a45c"/>
</svg>
